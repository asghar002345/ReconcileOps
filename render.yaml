# ReconcileOps — Render Blueprint
# Dashboard: https://dashboard.render.com/ → New → Blueprint → connect this repo
#
# Services:
#   - reconcileops-api     NestJS API (web)
#   - reconcileops-redis   Key Value (Valkey)
#   - reconcileops-db      PostgreSQL
#
# Background workers are not available on Render free. Async import/reconcile
# need a paid worker (`type: worker`, plan starter+) or a local `npm run start:worker`.
#
# After the API URL is live, set CORS_ORIGINS to your Vercel frontend URL.

databases:
  - name: reconcileops-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: reconcileops
    user: reconcileops

services:
  - type: keyvalue
    name: reconcileops-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: reconcileops-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
      - key: DATABASE_URL
        fromDatabase:
          name: reconcileops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: reconcileops-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: WEBHOOK_TOLERANCE_SECONDS
        value: "300"
      - key: CORS_ORIGINS
        sync: false
